<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Macro Local</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#5b5bf0">
<style>
:root{--bg:#fff;--bg2:#f6f6f7;--fg:#1c1c1e;--mut:#76767c;--bd:#e3e3e6;--ac:#5b5bf0;--acbg:#ececff;--red:#d33}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--bg2:#1f1f22;--fg:#ececee;--mut:#8f8f96;--bd:#2d2d31;--ac:#8c8cff;--acbg:#26264a;--red:#f66}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.danger{color:var(--red)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;width:100%}
input[type=checkbox],input[type=radio]{width:auto}textarea{resize:vertical}
#side{width:190px;background:var(--bg2);border-right:1px solid var(--bd);padding:12px 8px;display:flex;flex-direction:column;gap:2px;flex:none}
#side h1{font-size:15px;margin:0 8px 10px}
#side a{padding:6px 10px;border-radius:6px;cursor:pointer}
#side a.on{background:var(--acbg);color:var(--ac);font-weight:600}#side .sp{flex:1}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--bd);align-items:center}
#top input{max-width:420px}
#view{flex:1;overflow:auto;padding:16px}
#detail{width:440px;border-left:1px solid var(--bd);padding:16px;overflow:auto;flex:none;display:none}
#detail.open{display:block}
h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:10px}
h3{margin:18px 0 8px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer}
.row:hover,.row.sel{border-color:var(--ac)}.row .m{color:var(--mut);margin-left:auto;font-size:12px;white-space:nowrap}
.row.unread b{color:var(--ac)}
.tag{font-size:11px;background:var(--acbg);color:var(--ac);border-radius:10px;padding:1px 8px}
.board{display:flex;gap:12px;align-items:flex-start}
.col{flex:1;min-width:190px;background:var(--bg2);border-radius:10px;padding:8px;min-height:120px}
.col h3{margin:2px 4px 8px;font-size:12px;text-transform:uppercase;color:var(--mut)}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:6px;cursor:grab}
.card:hover{border-color:var(--ac)}
.tabs{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap}.tabs button.on{background:var(--acbg);color:var(--ac)}
.field{margin-bottom:8px}.field label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase}
.title{font-size:20px;font-weight:600;border:none;padding:4px 0}
.prev{border:1px solid var(--bd);border-radius:6px;padding:8px;margin-top:6px;white-space:pre-wrap}
.lnk{color:var(--ac);cursor:pointer}.lnk.dead{color:var(--mut);text-decoration:line-through}
.chat{display:flex;flex-direction:column;height:100%}.msgs{flex:1;overflow:auto}
.msg{padding:4px 0}.msg b{margin-right:6px}.msg small{color:var(--mut)}.msg button{display:none;font-size:11px;padding:0 6px;margin-left:6px}.msg:hover button{display:inline}
.empty{color:var(--mut);padding:30px;text-align:center}
.split{display:flex;gap:14px;height:100%}.split>.l{width:340px;overflow:auto;flex:none}.split>.r{flex:1;overflow:auto;min-width:0}
.mailbody{white-space:pre-wrap;border-top:1px solid var(--bd);margin-top:10px;padding-top:10px}
.note{background:var(--bg2);border-radius:8px;padding:8px 10px;margin:8px 0;color:var(--mut)}
.err{color:var(--red)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.cal .dh{background:var(--bg2);padding:4px 8px;font-size:11px;text-transform:uppercase;color:var(--mut)}
.cal .d{min-height:98px;border-top:1px solid var(--bd);border-left:1px solid var(--bd);padding:3px;cursor:pointer;overflow:hidden}
.cal .d:nth-child(7n+1){border-left:none}.cal .d.out{background:var(--bg2);opacity:.6}
.cal .d .n{font-size:12px;color:var(--mut)}.cal .d.today .n{background:var(--ac);color:#fff;border-radius:10px;padding:0 6px}
.chip{font-size:12px;background:var(--acbg);color:var(--ac);border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--mut)}
/* calls */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:12px}
.tile{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9}
.tile video{width:100%;height:100%;object-fit:cover}.tile span{position:absolute;left:8px;bottom:6px;color:#fff;font-size:12px;background:#0008;padding:0 6px;border-radius:4px}
#toast{position:fixed;right:16px;bottom:16px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;display:none;z-index:9;max-width:320px}
@media(max-width:800px){#side{width:60px}#side h1{display:none}#detail{position:fixed;inset:0;width:auto;z-index:5;background:var(--bg)}.split{flex-direction:column}.split>.l{width:auto;max-height:40%}}
</style>
</head>
<body>
<nav id="side"></nav>
<div id="main">
  <div id="top"><input id="q" placeholder="Search everything…  (press /)"></div>
  <div id="view"></div>
</div>
<aside id="detail"></aside>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(m,u,b)=>{const r=await fetch('/api'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json()};
const pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',5000)}
const RRULES={'':'Does not repeat','FREQ=DAILY':'Daily','FREQ=WEEKLY':'Weekly','FREQ=MONTHLY':'Monthly','FREQ=YEARLY':'Yearly'};
const TYPES={
  doc:{label:'Docs',one:'Doc',fields:[]},
  task:{label:'Tasks',one:'Task',fields:[['status','Status',['todo','doing','done']],['due','Due','date']],board:'status',cols:['todo','doing','done']},
  contact:{label:'Contacts',one:'Contact',fields:[['email','Email'],['phone','Phone'],['company','Company']]},
  company:{label:'Companies',one:'Company',fields:[['domain','Domain'],['industry','Industry']]},
  deal:{label:'Deals',one:'Deal',fields:[['stage','Stage',['lead','qualified','proposal','won','lost']],['value','Value ($)'],['contact','Contact']],board:'stage',cols:['lead','qualified','proposal','won','lost']},
  email:{label:'Email',one:'Email',fields:[['from','From'],['to','To'],['cc','Cc'],['date','Date']]},
  event:{label:'Events',one:'Event',fields:[['allday','All day',['no','yes']],['start','Start','dt'],['end','End','dt'],['rrule','Repeat',Object.keys(RRULES),RRULES],['location','Location']]},
  call:{label:'Calls',one:'Call',fields:[['status','Status',['live','ended']],['duration','Duration (min)'],['room','Room ID']]},
};
const NAV=[['docs','Docs'],['tasks','Tasks'],['chat','Chat'],['email','Email'],['calendar','Calendar'],['calls','Calls'],['crm','CRM'],['settings','Settings']];
const state={view:'docs',crmTab:'contact',channel:null,openId:null,timer:null,cal:{d:new Date(),mode:'month'},mail:{box:'inbox',sel:null,compose:null}};
let call=null;

function renderNav(){
  $('#side').innerHTML='<h1>◆ Macro Local</h1>'+NAV.map(([k,l])=>`${k==='settings'?'<div class="sp"></div>':''}<a data-v="${k}" class="${state.view===k?'on':''}">${l}${k==='calls'&&call?' 🔴':''}</a>`).join('');
  $('#side').querySelectorAll('a').forEach(a=>a.onclick=()=>go(a.dataset.v));
}
function go(v){
  state.view=v;clearInterval(state.timer);renderNav();
  if(v==='calls'&&call)return renderCallScreen();
  ({docs:()=>listView('doc'),tasks:()=>boardView('task'),chat:chatView,email:emailView,calendar:calendarView,calls:callsView,crm:crmView,settings:settingsView})[v]();
}
async function newItem(type,data={},title='Untitled'){
  const defaults={task:{status:'todo'},deal:{stage:'lead'}}[type]||{};
  const it=await api('POST','/items',{type,title,data:{...defaults,...data}});
  await go(state.view);openItem(it.id);return it;
}

/* ---------- list & board ---------- */
async function listView(type,host=$('#view'),header=true){
  const items=await api('GET','/items?type='+type),T=TYPES[type];
  host.innerHTML=(header?`<h2>${T.label} <button class="pri" id="new">+ New ${T.one}</button></h2>`:'')+
    (items.length?items.map(i=>`<div class="row" data-id="${i.id}"><b>${esc(i.title||'Untitled')}</b>
      <span class="m">${esc(i.data.email||i.data.domain||new Date(i.updated*1000).toLocaleDateString())}</span></div>`).join(''):`<div class="empty">Nothing here yet.</div>`);
  host.querySelectorAll('.row').forEach(r=>r.onclick=()=>openItem(r.dataset.id));
  if(header)$('#new').onclick=()=>newItem(type);
}
async function boardView(type,host=$('#view'),header=true){
  const items=await api('GET','/items?type='+type),T=TYPES[type],f=T.board;
  host.innerHTML=(header?`<h2>${T.label} <button class="pri" id="new">+ New ${T.one}</button></h2>`:'')+
   `<div class="board">${T.cols.map(c=>`<div class="col" data-c="${c}"><h3>${c} · ${items.filter(i=>(i.data[f]||T.cols[0])===c).length}</h3>${
     items.filter(i=>(i.data[f]||T.cols[0])===c).map(i=>`<div class="card" draggable="true" data-id="${i.id}">${esc(i.title)}${i.data.due?`<br><small class="tag">${esc(i.data.due)}</small>`:''}${i.data.value?`<br><small class="tag">$${esc(i.data.value)}</small>`:''}</div>`).join('')}</div>`).join('')}</div>`;
  host.querySelectorAll('.card').forEach(c=>{c.onclick=()=>openItem(c.dataset.id);c.ondragstart=e=>e.dataTransfer.setData('id',c.dataset.id)});
  host.querySelectorAll('.col').forEach(c=>{c.ondragover=e=>e.preventDefault();c.ondrop=async e=>{e.preventDefault();await api('PUT','/items/'+e.dataTransfer.getData('id'),{data:{[f]:c.dataset.c}});boardView(type,host,header)}});
  if(header)$('#new').onclick=()=>newItem(type);
}
function crmView(){
  const v=$('#view');
  v.innerHTML=`<div class="tabs">${['contact','company','deal'].map(t=>`<button data-t="${t}" class="${state.crmTab===t?'on':''}">${TYPES[t].label}</button>`).join('')}<button class="pri" id="new" style="margin-left:auto">+ New ${TYPES[state.crmTab].one}</button></div><div id="crm"></div>`;
  v.querySelectorAll('.tabs button[data-t]').forEach(b=>b.onclick=()=>{state.crmTab=b.dataset.t;crmView()});
  $('#new').onclick=()=>newItem(state.crmTab);
  (TYPES[state.crmTab].board?boardView:listView)(state.crmTab,$('#crm'),false);
}

/* ---------- item detail ---------- */
const toLocalInput=(s,allday)=>{if(!s)return'';if(allday)return s.slice(0,10);if(s.length===10)return s+'T09:00';if(s.endsWith('Z')){const d=new Date(s);return ymd(d)+'T'+hm(d)}return s.slice(0,16)};
function renderBody(txt,links){
  const map={};(links||[]).forEach(l=>map[l.ref]=l.item);
  return esc(txt).replace(/\[\[([^\]]+)\]\]/g,(m,n)=>{const it=map[n.replace(/&amp;/g,'&')];return it?`<a class="lnk" data-id="${it.id}">${esc(n)}</a>`:`<span class="lnk dead">${esc(n)}</span>`});
}
function fieldHtml(it,[k,l,opt,labels]){
  const v=it.data[k]??'';
  if(Array.isArray(opt)){const o=opt.includes(v)||v===''&&!opt.includes('')?opt:[...opt,v];
    return `<select data-k="${k}">${o.map(x=>`<option value="${esc(x)}" ${v===x?'selected':''}>${esc(labels?.[x]??(x||'—'))}</option>`).join('')}</select>`}
  if(opt==='dt'){const ad=it.data.allday==='yes';return `<input data-k="${k}" type="${ad?'date':'datetime-local'}" value="${esc(toLocalInput(v,ad))}">`}
  return `<input data-k="${k}" type="${opt||'text'}" value="${esc(v)}">`;
}
function normalizeData(type,data){
  if(type==='event'&&data.start){
    const ad=data.allday==='yes';
    if(ad){data.start=data.start.slice(0,10);data.end=(data.end||data.start).slice(0,10)}
    else{if(data.start.length===10)data.start+='T09:00';data.end=data.end?(data.end.length===10?data.end+'T10:00':data.end):data.start}
    if(data.end<data.start)data.end=data.start;
  }
  return data;
}
async function openItem(id){
  const it=await api('GET','/items/'+id);if(it.error)return;
  state.openId=id;const T=TYPES[it.type],d=$('#detail');d.classList.add('open');
  const extra=it.type==='event'?`<div class="field"><button id="addcall">+ Add video call link</button></div>`:
    it.type==='call'?`${it.data.recording?`<div class="field"><label>Recording</label><audio controls style="width:100%" src="/recordings/${esc(it.data.recording)}"></audio><a class="lnk" href="/recordings/${esc(it.data.recording)}" download>Download</a></div>`:''}
      <div class="field"><button id="copylink">Copy join link</button> ${it.data.status==='live'?'<button id="rejoin" class="pri">Join</button>':''}</div>`:'';
  d.innerHTML=`<div style="display:flex;gap:6px;margin-bottom:8px"><span class="tag">${T.one}</span><span style="flex:1"></span>
    ${it.type==='email'?'<button id="tocon">→ Contact</button><button id="totask">→ Task</button>':''}<button id="del" class="danger">Delete</button><button id="x">✕</button></div>
    <input class="title" id="t" value="${esc(it.title)}" placeholder="Title">${T.fields.map(f=>`<div class="field"><label>${f[1]}</label>${fieldHtml(it,f)}</div>`).join('')}${extra}
    <div class="field"><label>${it.type==='call'?'Notes / transcript':'Notes'} — link anything with [[Title]]</label><textarea id="b" rows="12">${esc(it.body)}</textarea>
    <div class="prev" id="pv"></div></div>
    <div class="field"><label>Linked from (${it.backlinks.length})</label>${it.backlinks.map(b=>`<div><a class="lnk" data-id="${b.id}">${esc(b.title||b.id)}</a> <span class="tag">${b.type}</span></div>`).join('')||'<small style="color:var(--mut)">No backlinks. Reference this item as [['+esc(it.title)+']] elsewhere.</small>'}</div>`;
  const pv=()=>$('#pv').innerHTML=renderBody($('#b').value,it.links)||'<small style="color:var(--mut)">Preview</small>';pv();
  let tm;const save=(reopen)=>{clearTimeout(tm);tm=setTimeout(async()=>{const data={};d.querySelectorAll('[data-k]').forEach(e=>data[e.dataset.k]=e.value);
    await api('PUT','/items/'+id,{title:$('#t').value,body:$('#b').value,data:normalizeData(it.type,data)});
    if(reopen)return openItem(id);it.links=(await api('GET','/items/'+id)).links;pv();softRefresh()},reopen?0:400)};
  d.querySelectorAll('input,textarea,select').forEach(e=>{e.oninput=()=>save();e.onchange=()=>save(e.dataset.k==='allday')});
  d.querySelectorAll('.lnk[data-id]').forEach(a=>a.onclick=()=>openItem(a.dataset.id));
  $('#x').onclick=()=>{d.classList.remove('open');state.openId=null};
  $('#del').onclick=async()=>{if(confirm('Delete this item?')){await api('DELETE','/items/'+id);d.classList.remove('open');go(state.view)}};
  if($('#tocon'))$('#tocon').onclick=async()=>openItem((await api('POST','/items/'+id+'/to-contact')).id);
  if($('#totask'))$('#totask').onclick=async()=>openItem((await api('POST','/items/'+id+'/to-task')).id);
  if($('#addcall'))$('#addcall').onclick=async()=>{const c=await api('POST','/items',{type:'call',title:'Call: '+(it.title||'event'),data:{room:rid(),status:'scheduled'}});
    await api('PUT','/items/'+id,{data:{location:callLink(c.data.room)},body:$('#b').value+`\n\nVideo call: [[${c.id}]]`});openItem(id)};
  if($('#copylink'))$('#copylink').onclick=()=>{navigator.clipboard?.writeText(callLink(it.data.room));toast('Join link copied')};
  if($('#rejoin'))$('#rejoin').onclick=()=>joinRoom(it.data.room,id);
}
let sr;function softRefresh(){clearTimeout(sr);sr=setTimeout(()=>{if(['docs','tasks','crm','calendar','calls'].includes(state.view)&&!(state.view==='calls'&&call)){const y=$('#view').scrollTop;go(state.view);$('#view').scrollTop=y}},50)}

/* ---------- chat ---------- */
async function chatView(){
  const chans=await api('GET','/channels');if(!state.channel||!chans.find(c=>c.id===state.channel))state.channel=chans[0].id;
  const v=$('#view');
  v.innerHTML=`<div class="chat"><div class="tabs">${chans.map(c=>`<button data-c="${c.id}" class="${c.id===state.channel?'on':''}"># ${esc(c.name)}</button>`).join('')}<button id="nc">+</button></div>
   <div class="msgs" id="msgs"></div><div style="display:flex;gap:6px;margin-top:8px"><input id="mi" placeholder="Message…"><button class="pri" id="ms">Send</button></div></div>`;
  v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{state.channel=b.dataset.c;chatView()});
  $('#nc').onclick=async()=>{const n=prompt('Channel name');if(n){await api('POST','/channels',{name:n});chatView()}};
  let since=0;const box=$('#msgs');
  const poll=async()=>{if(state.view!=='chat')return;const ms=await api('GET',`/channels/${state.channel}/messages?since=${since}`);
    if(!ms.length)return;const first=since===0,atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<60;
    ms.forEach(m=>{since=m.seq;const div=document.createElement('div');div.className='msg';
      div.innerHTML=`<b>${esc(m.author)}</b><small>${new Date(m.created*1000).toLocaleTimeString()}</small> <button>→ task</button>${m.task_id?` <a class="lnk" data-id="${m.task_id}">task</a>`:''}<div style="white-space:pre-wrap">${esc(m.text)}</div>`;
      div.querySelector('button').onclick=async()=>openItem((await api('POST',`/messages/${m.id}/to-task`)).id);
      const l=div.querySelector('.lnk');if(l)l.onclick=()=>openItem(l.dataset.id);box.appendChild(div)});
    if(first||atEnd)box.scrollTop=box.scrollHeight};
  const send=async()=>{const t=$('#mi').value.trim();if(!t)return;$('#mi').value='';await api('POST',`/channels/${state.channel}/messages`,{text:t,author:localStorage.name||'me'});poll()};
  $('#ms').onclick=send;$('#mi').onkeydown=e=>{if(e.key==='Enter')send()};
  await poll();state.timer=setInterval(poll,1500);
}

/* ---------- email ---------- */
async function emailView(){
  const [items,st]=await Promise.all([api('GET','/items?type=email'),api('GET','/settings')]);
  const configured=(st.email&&st.email.address&&st.email.has_password)||st.google?.connected&&st.google.mail,M=state.mail;
  const list=items.filter(i=>(i.data.folder||'inbox')===M.box).sort((a,b)=>(b.data.date||'').localeCompare(a.data.date||''));
  const sel=M.compose?null:items.find(i=>i.id===M.sel);
  const v=$('#view');
  v.innerHTML=`<div class="tabs"><button data-b="inbox" class="${M.box==='inbox'?'on':''}">Inbox</button><button data-b="sent" class="${M.box==='sent'?'on':''}">Sent</button>
    <span style="flex:1"></span><span id="ms" class="err"></span><button id="sync">⟳ Sync</button><button class="pri" id="comp">✎ Compose</button></div>
    ${configured?'':'<div class="note">No email account connected. Open <a class="lnk" id="gs">Settings</a> to add your IMAP/SMTP details (Gmail, Outlook, iCloud, Yahoo, or any provider).</div>'}
    <div class="split" style="height:calc(100% - 80px)"><div class="l">${list.map(i=>`<div class="row ${i.data.unread==='yes'?'unread':''} ${i.id===M.sel?'sel':''}" data-id="${i.id}" style="flex-direction:column;align-items:flex-start;gap:0"><b style="max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.title)}</b><small style="color:var(--mut)">${esc((M.box==='sent'?i.data.to:i.data.from)||'')} · ${esc((i.data.date||'').replace('T',' '))}</small></div>`).join('')||'<div class="empty">No messages.</div>'}</div>
    <div class="r" id="reader"></div></div>`;
  v.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{M.box=b.dataset.b;M.sel=null;M.compose=null;emailView()});
  v.querySelectorAll('.row').forEach(r=>r.onclick=async()=>{M.sel=r.dataset.id;M.compose=null;const it=items.find(i=>i.id===M.sel);
    if(it.data.unread==='yes')await api('PUT','/items/'+it.id,{data:{unread:'no'}});emailView()});
  if($('#gs'))$('#gs').onclick=()=>go('settings');
  $('#comp').onclick=()=>{M.compose={to:'',cc:'',subject:'',body:'',reply:''};emailView()};
  $('#sync').onclick=async()=>{$('#ms').textContent='Syncing…';$('#ms').className='';const r=await api('POST','/email/sync',{});
    if(r.error){$('#ms').textContent=r.error;$('#ms').className='err'}else{toast(r.new+' new message(s)');emailView()}};
  const rd=$('#reader');
  if(M.compose){const c=M.compose;

/* ---------- calendar ---------- */
function evRange(e){let s,en;
  if(e.allday){s=new Date(e.start.slice(0,10)+'T00:00');en=new Date(e.end.slice(0,10)+'T00:00');en.setDate(en.getDate()+1)}
  else{s=new Date(e.start);en=new Date(e.end||e.start)}
  return [s,en]}
function eachDay(s,en,fn){const d=new Date(s.getFullYear(),s.getMonth(),s.getDate());let n=0;do{fn(new Date(d));d.setDate(d.getDate()+1)}while(d<en&&++n<60)}
async function calendarView(){
  const C=state.cal,v=$('#view');let a,b;
  if(C.mode==='month'){const f=new Date(C.d.getFullYear(),C.d.getMonth(),1);a=new Date(f);a.setDate(1-f.getDay());b=new Date(a);b.setDate(a.getDate()+41)}
  else{a=new Date();a.setHours(0,0,0,0);b=new Date(a);b.setDate(a.getDate()+30)}
  const evs=await api('GET',`/calendar?start=${ymd(a)}&end=${ymd(b)}`),byDay={};
  evs.forEach(e=>{const[s,en]=evRange(e);eachDay(s,en,d=>(byDay[ymd(d)]??=[]).push({...e,s,en,first:ymd(d)===ymd(s)}))});
  const head=`<div class="tabs"><button id="pr">‹</button><button id="td">Today</button><button id="nx">›</button>
    <b style="font-size:16px;min-width:150px">${C.mode==='month'?C.d.toLocaleDateString(undefined,{month:'long',year:'numeric'}):'Next 30 days'}</b>
    <button data-m="month" class="${C.mode==='month'?'on':''}">Month</button><button data-m="agenda" class="${C.mode==='agenda'?'on':''}">Agenda</button>
    <span style="flex:1"></span><button class="pri" id="ne">+ New Event</button></div>`;
  const chip=e=>`<div class="chip" data-id="${e.id}" title="${esc(e.title)}">${e.allday||!e.first?'':hm(e.s)+' '}${esc(e.title)}</div>`;
  if(C.mode==='month'){let cells='';const today=ymd(new Date());
    for(let i=0;i<42;i++){const d=new Date(a);d.setDate(a.getDate()+i);const k=ymd(d),l=byDay[k]||[];
      cells+=`<div class="d ${d.getMonth()!==C.d.getMonth()?'out':''} ${k===today?'today':''}" data-d="${k}"><span class="n">${d.getDate()}</span>${l.slice(0,3).map(chip).join('')}${l.length>3?`<div class="more">+${l.length-3} more</div>`:''}</div>`}
    v.innerHTML=head+`<div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dh">${x}</div>`).join('')}${cells}</div>`;
  }else{const days=Object.keys(byDay).sort();
    v.innerHTML=head+(days.map(k=>`<h3>${new Date(k+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</h3>`+byDay[k].sort((x,y)=>x.s-y.s).map(e=>`<div class="row" data-id="${e.id}"><b>${esc(e.title)}</b><span class="m">${e.allday?'All day':hm(e.s)+'–'+hm(e.en)}${e.location?' · '+esc(e.location):''}</span></div>`).join('')).join('')||'<div class="empty">No upcoming events.</div>')}
  v.querySelectorAll('[data-id]').forEach(c=>c.onclick=e=>{e.stopPropagation();openItem(c.dataset.id)});
  v.querySelectorAll('.d').forEach(c=>c.onclick=()=>newItem('event',{allday:'no',start:c.dataset.d+'T09:00',end:c.dataset.d+'T10:00',rrule:''},'New event'));
  v.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{C.mode=x.dataset.m;calendarView()});
  $('#pr').onclick=()=>{C.d=new Date(C.d.getFullYear(),C.d.getMonth()-1,1);calendarView()};
  $('#nx').onclick=()=>{C.d=new Date(C.d.getFullYear(),C.d.getMonth()+1,1);calendarView()};
  $('#td').onclick=()=>{C.d=new Date();calendarView()};
  $('#ne').onclick=()=>{const t=new Date();t.setMinutes(0);t.setHours(t.getHours()+1);const e=new Date(t.getTime()+3600e3);
    newItem('event',{allday:'no',start:ymd(t)+'T'+hm(t),end:ymd(e)+'T'+hm(e),rrule:''},'New event')};
}
/* reminders: notify 10 minutes before timed events while the app is open */
const notified=new Set();
async function checkReminders(){
  try{const t=new Date(),e=new Date(t.getTime()+864e5),evs=await api('GET',`/calendar?start=${ymd(t)}&end=${ymd(e)}`);
    evs.filter(x=>!x.allday).forEach(x=>{const s=new Date(x.start),mins=(s-t)/6e4,k=x.id+x.start;
      if(mins>-1&&mins<=10&&!notified.has(k)){notified.add(k);const msg=`${x.title} at ${hm(s)}${x.location?' · '+x.location:''}`;
        toast('⏰ '+msg);if(window.Notification&&Notification.permission==='granted')new Notification('Upcoming event',{body:msg})}})}catch(e){}
}
setInterval(checkReminders,60000);setTimeout(checkReminders,3000);

/* ---------- calls (peer-to-peer WebRTC; the server only relays signaling) ---------- */
const rid=()=>Math.random().toString(36).slice(2,5)+'-'+Math.random().toString(36).slice(2,6)+'-'+Math.random().toString(36).slice(2,5);
const callLink=r=>location.origin+'/#call/'+r;
async function callsView(){
  const items=await api('GET','/items?type=call'),v=$('#view');
  v.innerHTML=`<h2>Calls <button class="pri" id="start">📹 Start call</button> <button id="join">Join with link…</button></h2>
   <div class="note">Calls are peer-to-peer video/audio in the app. Share the join link with anyone who can reach this server (same network, or <code>MACRO_HOST=0.0.0.0</code> with HTTPS for other machines). Record the audio and keep notes — everything is saved here.</div>
   ${items.map(i=>`<div class="row" data-id="${i.id}"><b>${esc(i.title)}</b>${i.data.recording?'<span class="tag">recording</span>':''}<span class="tag">${esc(i.data.status||'')}</span><span class="m">${new Date(i.created*1000).toLocaleString()}${i.data.duration?' · '+esc(i.data.duration)+' min':''}</span></div>`).join('')||'<div class="empty">No calls yet.</div>'}`;
  v.querySelectorAll('.row').forEach(r=>r.onclick=()=>openItem(r.dataset.id));
  $('#start').onclick=async()=>{const it=await api('POST','/items',{type:'call',title:'Call '+new Date().toLocaleString(),data:{room:rid(),status:'live'}});joinRoom(it.data.room,it.id)};
  $('#join').onclick=()=>{const m=(prompt('Paste the join link or room ID')||'').match(/([a-z0-9]+-[a-z0-9]+-[a-z0-9]+)\s*$/i);if(m)joinByRoom(m[1])};
}
async function joinByRoom(room){
  const items=await api('GET','/items?type=call'),it=items.find(i=>i.data.room===room);
  joinRoom(room,it?it.id:null);
}
async function joinRoom(room,itemId){
  if(call)return toast('Already in a call');
  state.view='calls';clearInterval(state.timer);
  localStorage.name=localStorage.name||prompt('Your name for calls','')||'guest';
  let local;
  try{local=await navigator.mediaDevices.getUserMedia({audio:true,video:true})}
  catch(e){try{local=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e2){renderNav();return toast('Camera/microphone unavailable ('+e2.name+'). Browsers require https:// or localhost.')}}
  const j=await api('POST',`/rooms/${room}/join`,{name:localStorage.name});
  call={room,itemId,id:j.id,pcs:{},pend:{},streams:{},names:{},local,start:Date.now(),rec:null,recSrc:{}};
  if(itemId)api('PUT','/items/'+itemId,{data:{status:'live',room}});
  j.peers.forEach(p=>{call.names[p.id]=p.name;connectPeer(p.id,true)});
  call.timer=setInterval(pollRoom,1000);
  renderNav();renderCallScreen();
}
const sig=(to,type,data)=>api('POST',`/rooms/${call.room}/signal`,{from:call.id,to,type,data});
function connectPeer(pid,offerer){
  const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});call.pcs[pid]=pc;
  call.local.getTracks().forEach(t=>pc.addTrack(t,call.local));
  pc.onicecandidate=e=>e.candidate&&sig(pid,'ice',e.candidate);
  pc.ontrack=e=>{call.streams[pid]=e.streams[0];if(call.rec)mixIn(pid);renderTiles()};
  if(offerer)pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>sig(pid,'offer',pc.localDescription));
  return pc;
}
async function pollRoom(){
  if(!call)return;const r=await api('GET',`/rooms/${call.room}/poll?id=${call.id}`);
  r.peers.forEach(p=>call.names[p.id]=p.name);
  for(const m of r.msgs){let pc=call.pcs[m.from];
    if(m.type==='offer'){pc=pc||connectPeer(m.from,false);await pc.setRemoteDescription(m.data);await pc.setLocalDescription(await pc.createAnswer());sig(m.from,'answer',pc.localDescription);
      (call.pend[m.from]||[]).forEach(c=>pc.addIceCandidate(c));call.pend[m.from]=[]}
    else if(m.type==='answer'&&pc){await pc.setRemoteDescription(m.data);(call.pend[m.from]||[]).forEach(c=>pc.addIceCandidate(c));call.pend[m.from]=[]}
    else if(m.type==='ice'){if(pc&&pc.remoteDescription)pc.addIceCandidate(m.data);else(call.pend[m.from]??=[]).push(m.data)}}
  const ids=r.peers.map(p=>p.id);
  Object.keys(call.pcs).filter(id=>!ids.includes(id)).forEach(id=>{call.pcs[id].close();delete call.pcs[id];delete call.streams[id]});
  renderTiles();
}
function renderCallScreen(){
  $('#view').innerHTML=`<h2>In call <span class="tag" id="ct">00:00</span> <button id="cp">Copy join link</button></h2><div class="tiles" id="tiles"></div>
   <div class="tabs"><button id="mic">🎤 Mute</button><button id="cam">📷 Camera off</button><button id="scr">🖥 Share screen</button><button id="rec">⏺ Record audio</button><button class="danger" id="leave">Leave</button></div>
   ${call.itemId?'<div class="field"><label>Notes</label><textarea id="cn" rows="8" placeholder="Call notes — use [[links]] to reference tasks, docs, contacts"></textarea></div>':''}`;
  const track=k=>call.local.getTracks().find(t=>t.kind===k);
  const tog=(id,k,on,off)=>{$(id).onclick=()=>{const t=track(k);if(!t)return;t.enabled=!t.enabled;$(id).textContent=t.enabled?on:off}};
  tog('#mic','audio','🎤 Mute','🎤 Unmute');tog('#cam','video','📷 Camera off','📷 Camera on');
  $('#cp').onclick=()=>{navigator.clipboard?.writeText(callLink(call.room));toast('Join link copied')};
  $('#scr').onclick=async()=>{try{const s=await navigator.mediaDevices.getDisplayMedia({video:true}),t=s.getVideoTracks()[0],old=track('video');
    Object.values(call.pcs).forEach(pc=>pc.getSenders().find(x=>x.track&&x.track.kind==='video')?.replaceTrack(t));
    call.local.addTrack(t);if(old)call.local.removeTrack(old);t.onended=()=>{if(old){Object.values(call.pcs).forEach(pc=>pc.getSenders().find(x=>x.track===t)?.replaceTrack(old));call.local.addTrack(old)}call.local.removeTrack(t);renderTiles()};renderTiles()}catch(e){}};
  $('#rec').onclick=toggleRec;$('#leave').onclick=leaveCall;
  if(call.itemId){api('GET','/items/'+call.itemId).then(it=>{if($('#cn'))$('#cn').value=it.body;});let tm;
    $('#cn').oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>api('PUT','/items/'+call.itemId,{body:$('#cn').value}),500)}}
  call.tiles={};renderTiles();
  call.clock=setInterval(()=>{const s=Math.floor((Date.now()-call.start)/1000);if($('#ct'))$('#ct').textContent=pad(Math.floor(s/60))+':'+pad(s%60)},1000);
}
function renderTiles(){
  const box=$('#tiles');if(!box||!call)return;
  const want={me:[call.local,localStorage.name+' (you)',true],...Object.fromEntries(Object.entries(call.streams).map(([k,s])=>[k,[s,call.names[k]||'guest',false]]))};
  Object.keys(call.tiles).filter(k=>!want[k]).forEach(k=>{call.tiles[k].remove();delete call.tiles[k]});
  for(const[k,[s,name,mute]]of Object.entries(want)){let t=call.tiles[k];
    if(!t){t=call.tiles[k]=document.createElement('div');t.className='tile';t.innerHTML='<video autoplay playsinline></video><span></span>';box.appendChild(t)}
    const vd=t.querySelector('video');if(vd.srcObject!==s)vd.srcObject=s;vd.muted=mute;t.querySelector('span').textContent=name}
}
function mixIn(pid){if(call.recSrc[pid]||!call.streams[pid]||!call.streams[pid].getAudioTracks().length)return;
  call.recSrc[pid]=call.ac.createMediaStreamSource(call.streams[pid]);call.recSrc[pid].connect(call.dest)}
async function toggleRec(){
  if(call.rec){call.rec.stop();return}
  if(!call.itemId)return toast('Recording needs a call saved on this server');
  call.ac=new AudioContext();call.dest=call.ac.createMediaStreamDestination();call.recSrc={};
  if(call.local.getAudioTracks().length)call.ac.createMediaStreamSource(new MediaStream(call.local.getAudioTracks())).connect(call.dest);
  Object.keys(call.streams).forEach(mixIn);
  const chunks=[];call.rec=new MediaRecorder(call.dest.stream);call.rec.ondataavailable=e=>chunks.push(e.data);
  call.rec.onstop=async()=>{call.rec=null;call.ac.close();if($('#rec'))$('#rec').textContent='⏺ Record audio';
    await fetch(`/api/calls/${call.itemId}/recording`,{method:'POST',body:new Blob(chunks,{type:'audio/webm'})});toast('Recording saved to the call')};
  call.rec.start();$('#rec').textContent='⏹ Stop recording (recording…)';
}
async function leaveCall(){
  const c=call;if(c.rec){const done=new Promise(r=>c.rec.addEventListener('stop',()=>setTimeout(r,500)));c.rec.stop();await done}
  clearInterval(c.timer);clearInterval(c.clock);Object.values(c.pcs).forEach(pc=>pc.close());c.local.getTracks().forEach(t=>t.stop());
  await api('POST',`/rooms/${c.room}/leave`,{id:c.id});
  if(c.itemId){const mins=Math.max(1,Math.round((Date.now()-c.start)/6e4));
    const left=(await api('GET',`/rooms/${c.room}/poll?id=none`)).peers.length;
    await api('PUT','/items/'+c.itemId,{data:{status:left?'live':'ended',duration:String(mins)}})}
  call=null;go('calls');
}
window.addEventListener('beforeunload',()=>{if(call)navigator.sendBeacon(`/api/rooms/${call.room}/leave`,JSON.stringify({id:call.id}))});

  $('#addfeed').onclick=()=>{const d=document.createElement('div');d.className='field';d.style.cssText='display:flex;gap:6px';d.innerHTML='<input class="fn" style="width:140px" placeholder="Name"><input class="fu" placeholder="https://…/basic.ics"><button>✕</button>';d.querySelector('button').onclick=()=>d.remove();$('#feeds').appendChild(d)};
  v.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>b.parentElement.remove());
  $('#savefeeds').onclick=async()=>{await api('POST','/settings',{feeds:collect()});$('#fmsg').textContent=' Syncing…';const r=await api('POST','/calendar/sync',{});
    $('#fmsg').className=r.errors.length?'err':'';$('#fmsg').textContent=r.errors.length?' '+r.errors.join('; '):` ${r.events} events synced`};
  $('#icsfile').onchange=async e=>{const t=await e.target.files[0].text();const r=await api('POST','/calendar/import',{ics:t});toast(r.imported+' events imported')};
  $('#notif').onclick=async()=>{if(!window.Notification)return toast('Notifications not supported here');toast('Permission: '+await Notification.requestPermission())};
}

const TZ=()=>Intl.DateTimeFormat().resolvedOptions().timeZone;
const CALDAV_PRESETS={icloud:'https://caldav.icloud.com',fastmail:'https://caldav.fastmail.com/dav/',nextcloud:'https://YOUR-SERVER/remote.php/dav',other:''};
function caldavSection(c){
  const box=$('#dsec');if(!box)return;
  if(c.connected){
    box.innerHTML=`<div class="note" style="color:var(--fg)">✅ Connected as <b>${esc(c.username)}</b> (${esc(c.url)})</div>
     <div class="field"><label>Calendars to sync</label>${c.calendars.map(x=>`<div><label style="text-transform:none;font-size:14px;color:var(--fg)"><input type="checkbox" class="dc" value="${esc(x.href)}" ${x.selected?'checked':''}> ${esc(x.name)}</label>
       <label style="display:inline;text-transform:none;font-size:12px;margin-left:10px"><input type="radio" name="dd" value="${esc(x.href)}" ${c.default===x.href?'checked':''}> new events go here</label></div>`).join('')}</div>
     ${c.error?`<div class="err">Last error: ${esc(c.error)}</div>`:''}
     <button class="pri" id="d_save">Save &amp; sync now</button> <button class="danger" id="d_off">Disconnect</button> <span id="d_msg"></span>
     <div><small style="color:var(--mut)">Pulled every 10 min; your edits are pushed immediately. Alarms, attendees and other details set in Apple Calendar are preserved when you edit an event here.</small></div>`;
    $('#d_save').onclick=async()=>{const m=$('#d_msg');m.className='';m.textContent=' Syncing…';
      const sel=[...box.querySelectorAll('.dc:checked')].map(x=>x.value),def=(box.querySelector('[name=dd]:checked')||{}).value;
      await api('POST','/caldav/calendars',{selected:sel,default:def});const r=await api('POST','/caldav/sync',{});
      m.className=r.error?'err':'';m.textContent=r.error?' '+r.error:` Done — ${r.events} events`};
    $('#d_off').onclick=async()=>{if(confirm('Disconnect this calendar? Events already synced stay in Macro Local.')){await api('POST','/caldav/disconnect',{});settingsView()}};
    return;
  }
  box.innerHTML=`<div class="note">Works with <b>iCloud</b>, Fastmail, Nextcloud and any CalDAV server. For iCloud, create an <b>app-specific password</b>: <a class="lnk" href="https://account.apple.com/account/manage" target="_blank" rel="noopener">Apple Account</a> → Sign-In and Security → App-Specific Passwords. Your normal Apple ID password will not work.</div>
   <div class="tabs">Preset: ${Object.keys(CALDAV_PRESETS).map(p=>`<button data-dp="${p}">${p}</button>`).join('')}</div>
   <div class="field"><label>Server URL</label><input id="d_url" value="${esc(c.url||CALDAV_PRESETS.icloud)}"></div>
   <div class="field"><label>Username (iCloud: your Apple ID email)</label><input id="d_user" value="${esc(c.username||'')}"></div>
   <div class="field"><label>Password (iCloud: app-specific password)</label><input id="d_pw" type="password"></div>
   <button class="pri" id="d_go">Connect</button> <span id="d_msg"></span>`;
  box.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>$('#d_url').value=CALDAV_PRESETS[b.dataset.dp]);
  $('#d_go').onclick=async()=>{const m=$('#d_msg');m.className='';m.textContent=' Connecting…';
    const r=await api('POST','/caldav/connect',{url:$('#d_url').value,username:$('#d_user').value,password:$('#d_pw').value,timezone:TZ()});
    if(r.error){m.className='err';m.textContent=' '+r.error;return}
    m.textContent=' Syncing…';const sy=await api('POST','/caldav/sync',{});toast(sy.error?sy.error:`Connected — ${sy.events} events synced`);settingsView()};
}
function googleSection(g){
  const box=$('#gsec');if(!box)return;
  if(g.connected){
    box.innerHTML=`<div class="note" style="color:var(--fg)">✅ Connected as <b>${esc(g.email)}</b></div>
     <div class="field"><label style="text-transform:none;font-size:14px;color:var(--fg)"><input type="checkbox" id="g_mail" ${g.mail?'checked':''}> Sync Gmail (inbox + sent, send mail, read-state) — every 5 min</label></div>
     <div class="field"><label style="text-transform:none;font-size:14px;color:var(--fg)"><input type="checkbox" id="g_cal" ${g.calendar?'checked':''}> Two-way sync with Google Calendar (primary) — pull every 10 min, edits you make here are pushed immediately</label></div>
     ${g.error?`<div class="err">Last error: ${esc(g.error)}</div>`:''}
     <button class="pri" id="g_sync">Sync now</button> <button class="danger" id="g_off">Disconnect</button> <span id="g_msg"></span>`;
    $('#g_mail').onchange=e=>api('POST','/google/config',{mail:e.target.checked});
    $('#g_cal').onchange=e=>api('POST','/google/config',{calendar:e.target.checked});
    $('#g_sync').onclick=async()=>{$('#g_msg').textContent=' Syncing…';const r=await api('POST','/google/sync',{});
      $('#g_msg').className=r.error?'err':'';$('#g_msg').textContent=r.error?' '+r.error:` Done — ${r.mail.new} new message(s), ${r.calendar.events} calendar events`};
    $('#g_off').onclick=async()=>{if(confirm('Disconnect Google? Your synced mail and events stay in Macro Local.')){await api('POST','/google/disconnect',{});settingsView()}};
    return;
  }
  box.innerHTML=`<details ${g.has_secret?'':'open'}><summary style="cursor:pointer"><b>One-time setup</b> (about 5 minutes) — you create your own private Google "app" so no one else sees your data</summary>
   <ol style="line-height:1.7">
    <li>Open <a class="lnk" href="https://console.cloud.google.com/projectcreate" target="_blank" rel="noopener">Google Cloud Console → New project</a> (any name).</li>
    <li>Enable the APIs: <a class="lnk" href="https://console.cloud.google.com/apis/library/gmail.googleapis.com" target="_blank" rel="noopener">Gmail API</a> and <a class="lnk" href="https://console.cloud.google.com/apis/library/calendar-json.googleapis.com" target="_blank" rel="noopener">Google Calendar API</a> (click <i>Enable</i> on each).</li>
    <li><a class="lnk" href="https://console.cloud.google.com/auth/overview" target="_blank" rel="noopener">Google Auth platform</a> → <i>Get started</i>: app name “Macro Local”, audience <b>External</b>, your email as contact. Then under <i>Audience</i> click <b>Publish app</b> (otherwise Google expires your connection every 7 days). Google will warn the app is unverified — that's fine, it's yours.</li>
    <li><a class="lnk" href="https://console.cloud.google.com/auth/clients" target="_blank" rel="noopener">Clients</a> → <i>Create client</i> → type <b>Desktop app</b>. Copy the Client ID and Client secret below.</li>
   </ol></details>
   <div class="field"><label>Client ID</label><input id="g_id" value="${esc(g.client_id||'')}" placeholder="1234…apps.googleusercontent.com"></div>
   <div class="field"><label>Client secret ${g.has_secret?'(saved — leave blank to keep)':''}</label><input id="g_sec" type="password"></div>
   <button class="pri" id="g_go">Connect Google</button> <span id="g_msg"></span>
   <div class="note" style="margin-top:10px">Google will show “Google hasn't verified this app” → click <b>Advanced</b> → <b>Go to Macro Local (unsafe)</b>, then allow Gmail and Calendar. Tokens stay on this computer.</div>`;
  $('#g_go').onclick=async()=>{const m=$('#g_msg');m.className='';
    if(!$('#g_id').value.trim()||(!g.has_secret&&!$('#g_sec').value))return m.textContent=' Enter the client ID and secret first.',m.className='err';
    await api('POST','/google/config',{client_id:$('#g_id').value,client_secret:$('#g_sec').value,timezone:TZ()});
    const r=await api('POST','/google/connect',{timezone:TZ()});if(r.error){m.textContent=' '+r.error;m.className='err';return}
    window.open(r.url,'_blank');m.innerHTML=` Waiting for Google… <a class="lnk" href="${esc(r.url)}" target="_blank" rel="noopener">open sign-in again</a>`;
    clearInterval(state.timer);let tries=0;
    state.timer=setInterval(async()=>{const st=await api('GET','/settings');
      if(st.google.connected){clearInterval(state.timer);toast('Google connected: '+st.google.email);if(state.view==='settings')settingsView()}
      else if(++tries>150)clearInterval(state.timer)},2000)};
}

/* ---------- search ---------- */
let st;$('#q').oninput=e=>{clearTimeout(st);st=setTimeout(async()=>{const q=e.target.value;if(!q.trim()){go(state.view);return}
  clearInterval(state.timer);const rs=await api('GET','/search?q='+encodeURIComponent(q));
  $('#view').innerHTML=`<h2>Results for “${esc(q)}”</h2>`+(rs.map(r=>`<div class="row" data-id="${r.kind==='item'?r.id:''}"><span class="tag">${r.type}</span><b>${esc(r.title||'Untitled')}</b><span class="m">${esc(r.snippet||('#'+(r.channel||'')))}</span></div>`).join('')||'<div class="empty">No results.</div>');
  $('#view').querySelectorAll('.row').forEach(r=>r.onclick=()=>r.dataset.id&&openItem(r.dataset.id))},200)};
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
fetch('/api/ping').catch(()=>{});setInterval(()=>fetch('/api/ping').catch(()=>{}),15000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
const m=location.hash.match(/^#call\/(.+)$/);
go('docs');
if(m){history.replaceState(null,'',location.pathname);joinByRoom(m[1])}
</script>
</body>
</html>
