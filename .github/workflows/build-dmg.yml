name: Build macOS DMG

on:
  push:
    branches: [main]            # every push to main builds a DMG and publishes it as a new release
    paths-ignore: ["**.md", ".gitignore"]
  workflow_dispatch:             # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp the version
        run: echo "v1.0.${{ github.run_number }}" > VERSION

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Make the app icon
        run: |
          set -e
          mkdir MacroLocal.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s static/icon-1024.png --out MacroLocal.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) static/icon-1024.png --out MacroLocal.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns MacroLocal.iconset -o MacroLocal.icns

      - name: Build MacroLocal.app
        run: |
          python -m pip install pyinstaller certifi
          python build.py

      - name: Create the installer DMG
        run: |
          set -e
          mkdir dmg-root
          cp -R dist/MacroLocal.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Macro Local" -srcfolder dmg-root -ov -format UDZO MacroLocal.dmg
          hdiutil verify MacroLocal.dmg
          ls -lh MacroLocal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: MacroLocal-dmg
          path: MacroLocal.dmg

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" MacroLocal.dmg --target "$GITHUB_SHA" --latest \
            --title "Macro Local $TAG" \
            --notes "Open the DMG and drag **Macro Local** into **Applications**. The app is not signed with an Apple Developer ID, so the first launch needs a one-time approval: right-click the app → Open (macOS 14 and earlier), or System Settings → Privacy & Security → Open Anyway (macOS 15+). Apple Silicon build."
